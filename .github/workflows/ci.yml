name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Anchor comparison branch to the PR event
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git update-ref refs/remotes/origin/main "$BASE_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run package:smoke
      - run: bun run host:smoke
      - run: bun run host:browser-smoke
      - run: bun run language-service:smoke
      - run: bun run language-service:browser-smoke
      - run: bun run projection:smoke
      - run: bun run syntax:smoke
      - run: bun run syntax:browser-smoke
      - run: bun run adapter-scheman:smoke
      - run: bun run codemirror:smoke
      - run: bun run codemirror:browser-smoke
      - name: Validate ordinary PR Changesets
        if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPOSITORY: ${{ github.event.repository.full_name }}
        run: bun run changeset:check -- "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_REPOSITORY"
      - name: Validate generated release integrity
        if: github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository
        run: bun scripts/validate-release-pr.ts origin/main
